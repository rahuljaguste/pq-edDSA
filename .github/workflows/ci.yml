name: CI

on:
  push:
    branches: [main]
  pull_request:
  # binius64 is pinned to a git revision, so nothing here drifts on its own. This catches
  # the other direction: a GitHub Actions image or rustup change breaking the build while
  # nobody is looking at it.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a failing proof is worth far more than the log noise costs.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel, targets and components; rustup honours it.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Release only. Proving in debug is slow enough to time the job out, and the
      # measurements this repository publishes are release measurements.
      - run: cargo test --workspace --release

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # This job exists because of a bug we hit upstream: binius64's wasm32 SIMD module
      # had been broken by a refactor for some time, and nothing in their CI built that
      # configuration, so nobody noticed. A target nothing builds is a target that rots.
      # Deliberately without -C target-feature=+simd128 -- that is the configuration the
      # demo ships, and the flag still fails upstream (binius-zk/binius64#1993).
      - run: cargo build --release --target wasm32-unknown-unknown -p pq-eddsa-wasm
