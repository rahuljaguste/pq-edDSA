name: CI

on:
  # main only. Feature branches do not burn CI minutes; open a pull request when ready.
  push:
    branches: [main, "spike/**"]
  # Pull requests targeting main only, and every run from an external contributor waits
  # for a maintainer to approve it. See the repository's Actions settings: "Require
  # approval for all external contributors".
  pull_request:
    branches: [main]
    # Spike branches too, or a job added to test one never runs before merge.
  # So a maintainer can run it on demand without pushing.
  workflow_dispatch:
  # binius64 is pinned to a git revision, so nothing here drifts on its own. This catches
  # the other direction: a GitHub Actions image or rustup change breaking the build while
  # nobody is looking at it.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a failing proof is worth far more than the log noise costs.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the channel, targets and components; rustup honours it.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Release only. Proving in debug is slow enough to time the job out, and the
      # measurements this repository publishes are release measurements.
      - run: cargo test --workspace --release

  # The wide configuration has to be tested, not merely built. This repository's history
  # is a sequence of bugs where the wide path compiled cleanly and
  # produced narrow results: a CLI defaulting to a 96-bit target on a 256-bit field, a
  # stat subcommand reporting upstream's constant, a demo page hardcoding "96-bit", a
  # harness calling ZKVerifier::setup directly and getting the narrow budget. Every one
  # type-checked. Only running the tests catches them.
  #
  # Both features, deliberately. pq-eddsa/wide alone used to leave pq-eddsa-wasm
  # believing it was narrow; that is fixed now by reading config::IS_WIDE, and naming
  # both keeps the job honest if the forwarding ever changes.
  test-wide:
    name: test (release, wide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release --features pq-eddsa/wide,pq-eddsa-wasm/wide

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # This job exists because of a bug I hit upstream: binius64's wasm32 SIMD module
      # had been broken by a refactor for some time, and nothing in their CI built that
      # configuration, so nobody noticed. A target nothing builds is a target that rots.
      # Deliberately without -C target-feature=+simd128 -- that is the configuration the
      # demo ships, and the flag still fails upstream (binius-zk/binius64#1993).
      - run: cargo build --release --target wasm32-unknown-unknown -p pq-eddsa-wasm
      # GF(2^256)/SHA-512 compiling to wasm32 was an open question until measured; keep
      # it answered.
      - run: cargo build --release --target wasm32-unknown-unknown -p pq-eddsa-wasm --features wide
