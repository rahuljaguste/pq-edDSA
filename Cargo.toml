[workspace]
resolver = "2"
members = ["crates/ed25519", "crates/pq-eddsa", "crates/pq-eddsa-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rahuljaguste/pq-edDSA"

[workspace.dependencies]
binius-core = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
binius-frontend = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
binius-circuits = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
binius-prover = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
binius-verifier = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
binius-hash = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
num-bigint = "0.5.1"
anyhow = "1"
hex = "0.4"

[profile.release]
lto = "thin"

# SPIKE BRANCH ONLY. Points every binius crate at the fork's
# spike/genericize-verifier-256b, which adds SECURITY_BITS_WIDE, a GF(2^256) challenge
# field with SHA-512, and ZKVerifier::setup_with_security_bits. That branch is based on
# 21f0ceea, the same revision main pins, so the fork's own work is the only variable.
#
# A git rev, not a local path: an absolute path builds only on the machine that has it,
# which would make CI fail on every job rather than test the wide configuration. Pinned
# rather than tracking a branch, so the measurements stay reproducible.
#
# The rev lives on `spike/genericize-verifier-256b` in that fork, not on its main, and is
# reachable from that one branch and no tag. Cargo takes `branch` or `rev` but not both,
# so the branch is named here instead. **Delete, rebase or force-push that branch and this
# pin breaks permanently** -- the commit becomes unreachable, GitHub collects it, and every
# build here fails including CI. A tag would hold it independently of the branch:
#
#     git -C <fork> tag pq-eddsa-wide-base 251d595b
#     git -C <fork> push origin pq-eddsa-wide-base
#
# main must never carry this: the published numbers depend on a pinned public revision.
[patch."https://github.com/binius-zk/binius64"]
binius-circuits = { git = "https://github.com/rahuljaguste/binius64", rev = "251d595bae1e70aed119d4f08b4eff9d4db01dd7" }
binius-compute = { git = "https://github.com/rahuljaguste/binius64", rev = "251d595bae1e70aed119d4f08b4eff9d4db01dd7" }
binius-core = { git = "https://github.com/rahuljaguste/binius64", rev = "251d595bae1e70aed119d4f08b4eff9d4db01dd7" }
binius-field = { git = "https://github.com/rahuljaguste/binius64", rev = "251d595bae1e70aed119d4f08b4eff9d4db01dd7" }
binius-frontend = { git = "https://github.com/rahuljaguste/binius64", rev = "251d595bae1e70aed119d4f08b4eff9d4db01dd7" }
binius-hash = { git = "https://github.com/rahuljaguste/binius64", rev = "251d595bae1e70aed119d4f08b4eff9d4db01dd7" }
binius-iop = { git = "https://github.com/rahuljaguste/binius64", rev = "251d595bae1e70aed119d4f08b4eff9d4db01dd7" }
binius-iop-prover = { git = "https://github.com/rahuljaguste/binius64", rev = "251d595bae1e70aed119d4f08b4eff9d4db01dd7" }
binius-ip = { git = "https://github.com/rahuljaguste/binius64", rev = "251d595bae1e70aed119d4f08b4eff9d4db01dd7" }
binius-ip-prover = { git = "https://github.com/rahuljaguste/binius64", rev = "251d595bae1e70aed119d4f08b4eff9d4db01dd7" }
binius-math = { git = "https://github.com/rahuljaguste/binius64", rev = "251d595bae1e70aed119d4f08b4eff9d4db01dd7" }
binius-prover = { git = "https://github.com/rahuljaguste/binius64", rev = "251d595bae1e70aed119d4f08b4eff9d4db01dd7" }
binius-spartan-frontend = { git = "https://github.com/rahuljaguste/binius64", rev = "251d595bae1e70aed119d4f08b4eff9d4db01dd7" }
binius-spartan-prover = { git = "https://github.com/rahuljaguste/binius64", rev = "251d595bae1e70aed119d4f08b4eff9d4db01dd7" }
