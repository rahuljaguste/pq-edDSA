[workspace]
resolver = "2"
members = ["crates/ed25519", "crates/pq-eddsa", "crates/pq-eddsa-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rahuljaguste/pq-edDSA"

[workspace.dependencies]
binius-core = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
binius-frontend = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
binius-circuits = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
binius-prover = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
binius-verifier = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
binius-hash = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
num-bigint = "0.5.1"
anyhow = "1"
hex = "0.4"

[profile.release]
lto = "thin"

# SPIKE BRANCH ONLY. Points every binius crate at the local fork's
# spike/genericize-verifier-256b, which adds SECURITY_BITS_WIDE, a GF(2^256) challenge
# field with SHA-512, and ZKVerifier::setup_with_security_bits. That branch is based on
# 21f0ceea, the same revision main pins, so the only variable is the fork's own work.
#
# main must never carry this: the published numbers depend on a pinned public revision.
[patch."https://github.com/binius-zk/binius64"]
binius-circuits = { path = "/Users/rahuljaguste/pq/binius64/crates/circuits" }
binius-compute = { path = "/Users/rahuljaguste/pq/binius64/crates/compute" }
binius-core = { path = "/Users/rahuljaguste/pq/binius64/crates/core" }
binius-field = { path = "/Users/rahuljaguste/pq/binius64/crates/field" }
binius-frontend = { path = "/Users/rahuljaguste/pq/binius64/crates/frontend" }
binius-hash = { path = "/Users/rahuljaguste/pq/binius64/crates/hash" }
binius-iop = { path = "/Users/rahuljaguste/pq/binius64/crates/iop" }
binius-iop-prover = { path = "/Users/rahuljaguste/pq/binius64/crates/iop-prover" }
binius-ip = { path = "/Users/rahuljaguste/pq/binius64/crates/ip" }
binius-ip-prover = { path = "/Users/rahuljaguste/pq/binius64/crates/ip-prover" }
binius-math = { path = "/Users/rahuljaguste/pq/binius64/crates/math" }
binius-prover = { path = "/Users/rahuljaguste/pq/binius64/crates/prover" }
binius-spartan-frontend = { path = "/Users/rahuljaguste/pq/binius64/crates/spartan-frontend" }
binius-spartan-prover = { path = "/Users/rahuljaguste/pq/binius64/crates/spartan-prover" }
binius-spartan-verifier = { path = "/Users/rahuljaguste/pq/binius64/crates/spartan-verifier" }
binius-transcript = { path = "/Users/rahuljaguste/pq/binius64/crates/transcript" }
binius-utils = { path = "/Users/rahuljaguste/pq/binius64/crates/utils" }
binius-verifier = { path = "/Users/rahuljaguste/pq/binius64/crates/verifier" }
