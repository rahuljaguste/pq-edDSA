[package]
name = "pq-eddsa-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser bindings for PQ-EdDSA proving on Binius64 — unaudited research proof of concept"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `default-features = false` drops clap: the CLI is behind the `cli` feature so a
# browser build does not compile an argument parser it will never call.
pq-eddsa = { path = "../pq-eddsa", default-features = false }
binius-frontend.workspace = true
binius-verifier.workspace = true
wasm-bindgen = "0.2.126"
getrandom = "0.4"
rand = { version = "0.10.1", default-features = false, features = ["std", "std_rng"] }
hex.workspace = true

[features]
# SPIKE BRANCH ONLY. Forwards to pq-eddsa/wide: GF(2^256) challenges and SHA-512
# commitments, from an unmerged fork. Everything in this crate reads its types from
# pq_eddsa::config, so the feature is the only thing that has to move.
#
# Slow in a browser, measured rather than predicted: 6.14 s to prove and 604 MB of heap,
# against 1.7 s and 213 MB narrow. The browser penalty for wide is 12.2x, not the 14.8x
# that scaling the narrow figure would suggest -- WebAssembly has no carry-less multiply,
# so GF(2^256) multiplication is software either way, but the ratio does not carry across
# configurations. 604 MB is the number that would decide this on a phone, and that is
# still untested.
wide = ["pq-eddsa/wide"]

# The ZK path needs real entropy for blinding, and `Relation::Rand` needs it for `rx`.
# On wasm32 that means routing getrandom through the JS crypto API; without this the
# build fails to link.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
