[package]
name = "pq-eddsa"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PQ-EdDSA relations on Binius64 — unaudited research proof of concept"

[dependencies]
ed25519-binius = { path = "../ed25519" }
binius-core.workspace = true
binius-frontend.workspace = true
binius-circuits.workspace = true
num-bigint.workspace = true
anyhow.workspace = true
sha2 = "0.10"
hex.workspace = true
binius-prover.workspace = true
binius-verifier.workspace = true
binius-hash.workspace = true
binius-utils = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
# Spike branch only: the fork genericised the verifier over the challenge field, so the
# field type has to be named here.
binius-field = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
digest = "0.11"
clap = { version = "4", features = ["derive"], optional = true }
rand = { version = "0.10.1", default-features = false, features = ["std", "std_rng"] }
getrandom = "0.4"

[dev-dependencies]
curve25519-dalek = "4"
ed25519-dalek = "2"

[features]
default = ["cli"]
# The command-line binary. Optional so `pq-eddsa-wasm` can depend on the library
# without pulling clap into a browser build.
cli = ["dep:clap"]
# The fork's GF(2^256) challenge field with SHA-512 commitments.
# Selects a different field, packed type, hash suite and Fiat-Shamir challenger together.
wide = []
# Multi-threaded proving. Off by default so benchmarks are comparable across
# machines; enable with --features rayon.
rayon = ["binius-prover/rayon"]

[[bin]]
name = "cli"
required-features = ["cli"]
