# Task 0 de-risking spike. Throwaway: not a workspace member, deleted once
# docs/spikes/2026-task0-derisk.md records the finding.
#
# Question: does binius64 compile to wasm32 and produce a verifiable proof at all?
# A dependency that will not build for wasm32 kills Task 10, and we want that on
# day one rather than after nine tasks of work.

[package]
name = "wasm-smoke"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
binius-core = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
binius-frontend = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
binius-prover = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
binius-verifier = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
binius-hash = { git = "https://github.com/binius-zk/binius64", rev = "21f0ceeabfdd530c3c3508883caa436d8b0f15ab" }
rand = { version = "0.10.1", default-features = false, features = ["std", "std_rng"] }
getrandom = "0.4.0"

# The ZK path needs real entropy for blinding. On wasm32 that means routing
# getrandom through the JS crypto API; without this the build fails to link.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.0", features = ["wasm_js"] }

[profile.release]
lto = "thin"
opt-level = 3

